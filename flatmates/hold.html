<style>
:root{color-scheme:light; --brand:#0E9AA0; --brand-2:#0B7C82; --accent:#F26B1D; --ink:#10264F; --text-2:#4A5260;
  --grad:linear-gradient(172deg,#0E9AA0 0%,#0F8EA6 45%,#1F6CC4 100%); --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); background:var(--grad); color:#fff;
  font:16px/1.6 var(--font); -webkit-font-smoothing:antialiased; text-align:center; overflow-x:hidden; position:relative}
body::before, body::after{content:""; position:fixed; border-radius:50%; pointer-events:none; background:rgba(255,255,255,.08)}
body::before{width:520px; height:520px; top:-220px; right:-180px}
body::after{width:420px; height:420px; bottom:-200px; left:-160px}
.hold{position:relative; z-index:1; width:100%; max-width:520px}
.mark{display:inline-grid; place-items:center; width:120px; height:120px; border-radius:32px; background:#fff;
  box-shadow:0 18px 40px rgba(6,40,70,.25)}
.wordmark{margin:18px 0 0; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.wordmark b{font-weight:800} .wordmark .w-flat{color:#BFE1FF} .wordmark .w-mate{color:#B8F5DD}
.banner{display:inline-flex; align-items:center; gap:10px; margin:26px 0 0; padding:10px 22px; border-radius:999px;
  background:var(--accent); color:#fff; font-weight:800; font-size:15px; letter-spacing:.14em; text-transform:uppercase;
  box-shadow:0 10px 24px rgba(242,107,29,.35)}
.banner i{width:9px; height:9px; border-radius:50%; background:#fff; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.banner i{animation:none}}
h1{margin:22px 0 0; font-size:clamp(30px, 8vw, 44px); font-weight:800; letter-spacing:-.03em; line-height:1.12; text-wrap:balance}
.lead{margin:14px auto 0; max-width:440px; color:rgba(255,255,255,.88); font-size:17px; text-wrap:pretty}
.perks{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:24px 0 0; padding:0; list-style:none}
.perks li{padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  font-size:14px; font-weight:600}
footer{position:relative; z-index:1; margin-top:40px; font-size:13.5px; color:rgba(255,255,255,.75)}
footer a{color:#fff; text-underline-offset:3px}
@media (max-width:420px){ .mark{width:104px; height:104px; border-radius:28px} .mark svg{width:76px; height:76px} .wordmark{font-size:26px} .lead{font-size:16px} }
</style>
</head>
