<style>
/* The Coming soon page in the app's look (16 Nov 2026): a white page with pale tints of the logo's orange in two
   corners, the headline in the serif, the wordmark's near-black and grey for the words. The logo is as supplied.
   The typefaces travel with the page (vendor/fonts), so nothing is fetched from another site. */
@font-face{font-family:"Urbanist"; font-style:normal; font-weight:100 900; font-display:swap; src:url(vendor/fonts/urbanist-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"DM Serif Display"; font-style:normal; font-weight:400; font-display:swap; src:url(vendor/fonts/dm-serif-display-latin-400-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:light; --bg:#FFFFFF; --band:#DDECF8; --ink:#24272C; --text:#24272C; --text-2:#4F545C; --orange:#E2461B; --orange-soft:#FFF1EC; --line:#E6E9ED;
  --font:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"DM Serif Display",Georgia,"Times New Roman",serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  background:var(--bg); color:var(--text);
  font:500 16px/1.6 var(--font); -webkit-font-smoothing:antialiased; text-align:center; overflow-x:hidden; position:relative}
.hold{position:relative; z-index:1; width:100%; max-width:520px}
.mark{display:inline-grid; place-items:center; width:120px; height:120px; border-radius:28px; background:none}
.mark img{border-radius:22%; box-shadow:0 18px 40px rgba(194,65,12,.26)}
.wordmark{margin:18px 0 0; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.banner{display:inline-flex; align-items:center; gap:10px; margin:26px 0 0; padding:10px 22px; border-radius:999px;
  background:#fff; color:var(--ink); font-weight:800; font-size:14px; letter-spacing:.14em; text-transform:uppercase;
  box-shadow:0 8px 22px rgba(60,40,30,.1)}
.banner i{width:9px; height:9px; border-radius:50%; background:var(--orange); animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.banner i{animation:none}}
h1{margin:22px 0 0; font-family:var(--serif); font-size:clamp(40px, 11.5vw, 48px); font-weight:400; line-height:1.04; text-wrap:balance}
.lead{margin:14px auto 0; max-width:440px; color:var(--text-2); font-size:17px; text-wrap:pretty}
.perks{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:24px 0 0; padding:0; list-style:none}
.perks li{padding:7px 14px; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 1px var(--line);
  font-size:14px; font-weight:700}
footer{position:relative; z-index:1; margin-top:40px; font-size:13.5px; color:var(--text-2)}
footer a{color:var(--text); text-underline-offset:3px}
@media (max-width:420px){ .mark{width:104px; height:104px; border-radius:28px} .wordmark{font-size:26px} .lead{font-size:16px} }   /* the logo keeps its size (88px), as before */
</style>
</head>
<body>
<main class="hold">
  <span class="mark" aria-hidden="true"><img class="fm-mark" src="icons/logo-icon.svg" alt="" width="88" height="88"></span>
  <p class="wordmark"><img src="icons/wordmark.svg" alt="findmeflatmate.com" width="300" height="26"></p>
  <p class="banner" role="status"><i aria-hidden="true"></i>Coming soon</p>
  <h1>Find your vibe. Find your flatmate.</h1>
  <p class="lead">We're getting FindMeFlatMate ready for you. Rooms, and the people worth sharing them with, are almost here.</p>
  <ul class="perks" aria-label="What's coming">
    <li>🏠 Rooms &amp; whole flats</li><li>🤝 Flatmates who live like you</li><li>💸 Split rent &amp; bills</li>
  </ul>
</main>
<footer>© FindMeFlatMate · <a href="privacy.html">Privacy policy</a></footer>

try{ if(window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {}); }catch(e){}
</script>
